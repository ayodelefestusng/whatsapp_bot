version: '3.9'

services:
  evolution-api:
    container_name: evolution_api
    image: atendai/evolution-api:v2.1.1
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_net

  redis:
    image: redis:latest
    container_name: evolution_redis
    restart: always
    networks:
      - evolution_net

  nginx:
    image: nginx:latest
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - evolution_net
    depends_on:
      - evolution-api

volumes:
  evolution_instances:

networks:
  evolution_net:
    driver: bridge